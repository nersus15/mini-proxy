name: Build & Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:

    name: Build (${{ matrix.name }})

    runs-on: ${{ matrix.os }}

    timeout-minutes: 30

    strategy:
      fail-fast: false

      matrix:
        include:

          - name: linux
            os: ubuntu-latest

          - name: macos-arm
            os: macos-14

          - name: windows
            os: windows-latest

    steps:

      ##########################################################################
      # Checkout
      ##########################################################################

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ##########################################################################
      # Go
      ##########################################################################

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      ##########################################################################
      # Linux Dependencies
      ##########################################################################

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            pkg-config \
            librdkafka-dev \
            libsqlcipher-dev \
            zip

      ##########################################################################
      # macOS Dependencies
      ##########################################################################

      - name: Install macOS Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install \
            pkg-config \
            librdkafka \
            sqlcipher

      ##############################################################################
      # Windows Dependencies
      ##############################################################################

      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-librdkafka
            mingw-w64-x86_64-sqlcipher
            mingw-w64-x86_64-openssl
            zip

      ##############################################################################
      # Configure Windows Environment
      ##############################################################################

      - name: Configure Windows Environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

          "CC=gcc" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "CXX=g++" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          "PKG_CONFIG=C:\msys64\mingw64\bin\pkg-config.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "PKG_CONFIG_PATH=C:\msys64\mingw64\lib\pkgconfig" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          "CGO_ENABLED=1" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          "CGO_CFLAGS=-IC:\msys64\mingw64\include" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

          "CGO_LDFLAGS=-LC:\msys64\mingw64\lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV


      ##########################################################################
      # Permission
      ##########################################################################

      - name: Make Scripts Executable
        if: runner.os != 'Windows'
        run: chmod +x scripts/*.sh

      - name: Debug Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where gcc
          where pkg-config

          echo "========================"
          echo "Environment"
          echo "========================"

          echo "CC=$env:CC"
          echo "CXX=$env:CXX"
          echo "PKG_CONFIG=$env:PKG_CONFIG"
          echo "PKG_CONFIG_PATH=$env:PKG_CONFIG_PATH"

          & $env:PKG_CONFIG --version
          & $env:PKG_CONFIG --modversion rdkafka

          go env
      ##########################################################################
      # Build
      ##########################################################################

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/build.sh ${{ github.ref_name }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          bash ./scripts/build.sh $env:GITHUB_REF_NAME

      ##########################################################################
      # Upload
      ##########################################################################

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/

  ##########################################################################
  # Release
  ##########################################################################

  release:

    name: GitHub Release

    needs: build

    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/')

    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Merge Artifacts
        run: |
          mkdir release

          find artifacts -type f -exec cp {} release/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true